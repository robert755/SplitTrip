services:
  - type: web
    name: splittrip-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: "npm ci --include=dev && npx prisma migrate deploy && npm run build"
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: REFRESH_TOKEN_COOKIE_PATH
        value: /api/auth
